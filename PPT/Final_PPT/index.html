<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProofBridge — Final IIC 3.0 Pitch Deck</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body {
      background: #070605;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      font-family: var(--b, 'Inter', sans-serif);
      user-select: none;
    }

    #viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.9), 0 0 40px rgba(212,168,83,0.15);
      border-radius: 8px;
      overflow: hidden;
      transform-origin: center center;
    }

    iframe {
      width: 1920px;
      height: 1080px;
      border: none;
      display: block;
      pointer-events: auto;
    }

    .deck-nav {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(18, 16, 13, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 168, 83, 0.35);
      border-radius: 100px;
      padding: 8px 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7), 0 0 20px rgba(212,168,83,0.2);
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    .deck-nav.autohide {
      opacity: 0.15;
    }
    .deck-nav:hover {
      opacity: 1 !important;
    }

    .nav-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #F5F1E8;
      border-radius: 50px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: var(--h, sans-serif);
    }
    .nav-btn:hover {
      background: rgba(212, 168, 83, 0.2);
      border-color: #D4A853;
      color: #FFF;
      transform: translateY(-1px);
    }
    .nav-btn.primary {
      background: linear-gradient(135deg, #D4A853 0%, #B88628 100%);
      color: #0A0908;
      border: none;
      font-weight: 700;
      box-shadow: 0 0 16px rgba(212,168,83,0.4);
    }
    .nav-btn.primary:hover {
      background: linear-gradient(135deg, #E8C06A 0%, #C99632 100%);
      box-shadow: 0 0 24px rgba(212,168,83,0.6);
    }

    .slide-indicator {
      font-family: var(--m, monospace);
      font-size: 13px;
      color: #D4A853;
      padding: 0 12px;
      letter-spacing: 0.05em;
    }

    .deck-top-actions {
      position: fixed;
      top: 20px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 9999;
    }

    .badge-dl {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 50px;
      background: rgba(20, 18, 15, 0.85);
      border: 1px solid rgba(255,255,255,0.14);
      color: #F5F1E8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(12px);
      transition: all 0.2s;
    }
    .badge-dl:hover {
      border-color: #D4A853;
      background: rgba(212, 168, 83, 0.2);
      color: #FFF;
      box-shadow: 0 0 16px rgba(212,168,83,0.3);
    }

    .key-hint {
      font-size: 11px;
      opacity: 0.6;
      background: rgba(255,255,255,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <div class="deck-top-actions">
    <a href="ProofBridge_Pitch_Deck.pdf" download="ProofBridge_Pitch_Deck.pdf" class="badge-dl">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
      Download PDF
    </a>
    <a href="ProofBridge_Pitch_Deck.pptx" download="ProofBridge_Pitch_Deck.pptx" class="badge-dl">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12h6"/><path d="M12 9v6"/></svg>
      Download PPTX
    </a>
    <a href="http://localhost:3000" target="_blank" class="badge-dl" style="border-color: #22D3EE; color: #22D3EE;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      Live Prototype
    </a>
  </div>

  <div id="viewport">
    <iframe id="slide-frame" src="cover.html" allow="autoplay; fullscreen"></iframe>
  </div>

  <div class="deck-nav" id="deckNav">
    <button class="nav-btn" onclick="prevSlide()" title="Previous Slide (Left Arrow)">
      &#9664; Prev <span class="key-hint">&larr;</span>
    </button>
    <div class="slide-indicator" id="slideIndicator">01 / 09</div>
    <button class="nav-btn primary" onclick="nextSlide()" title="Next Slide (Right Arrow or Space)">
      Next &#9654; <span class="key-hint">&rarr;</span>
    </button>
    <div style="width: 1px; height: 18px; background: rgba(255,255,255,0.15); margin: 0 4px;"></div>
    <button class="nav-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      Fullscreen <span class="key-hint">F</span>
    </button>
  </div>

  <script>
    const slides = [
      "cover.html",
      "broken-triangle.html",
      "trust-chain.html",
      "core-breakthroughs.html",
      "ast-evidence.html",
      "architecture.html",
      "dean-radar.html",
      "feasibility.html",
      "team-roadmap.html"
    ];

    let currentIdx = 0;
    const frame = document.getElementById('slide-frame');
    const indicator = document.getElementById('slideIndicator');
    const viewport = document.getElementById('viewport');
    const deckNav = document.getElementById('deckNav');

    function resizeViewport() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const targetAspect = 1920 / 1080;
      const windowAspect = w / h;

      let scale;
      if (windowAspect > targetAspect) {
        scale = h / 1080;
      } else {
        scale = w / 1920;
      }
      viewport.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeViewport);
    resizeViewport();

    function updateSlide() {
      frame.src = slides[currentIdx];
      const cur = (currentIdx + 1).toString().padStart(2, '0');
      const tot = slides.length.toString().padStart(2, '0');
      indicator.textContent = `${cur} / ${tot}`;
      window.location.hash = (currentIdx + 1).toString();
    }

    function nextSlide() {
      if (currentIdx < slides.length - 1) {
        currentIdx++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentIdx > 0) {
        currentIdx--;
        updateSlide();
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Home') {
        e.preventDefault();
        currentIdx = 0;
        updateSlide();
      } else if (e.key === 'End') {
        e.preventDefault();
        currentIdx = slides.length - 1;
        updateSlide();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    if (window.location.hash) {
      const hashNum = parseInt(window.location.hash.replace('#', ''), 10);
      if (!isNaN(hashNum) && hashNum >= 1 && hashNum <= slides.length) {
        currentIdx = hashNum - 1;
      }
    }
    updateSlide();

    let hideTimeout;
    window.addEventListener('mousemove', () => {
      deckNav.classList.remove('autohide');
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        deckNav.classList.add('autohide');
      }, 3500);
    });
  </script>
</body>
</html>
